name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      # gijiroku's base :deps resolves io.github.kotoba-lang/langgraph via a
      # plain :git/sha dependency (not :local/root), so no sibling checkout
      # is needed here -- tools.deps fetches it over the network. The :dev
      # (langchain) and :bot-join (playwright) aliases still expect local
      # siblings, but neither is exercised by the :test/:lint steps below.
      - name: Checkout gijiroku
        uses: actions/checkout@v4
        with:
          path: work/orgs/kotoba-lang/gijiroku

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache m2 / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('work/orgs/kotoba-lang/gijiroku/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-jdk${{ matrix.java }}-clj-

      - name: Run tests
        working-directory: work/orgs/kotoba-lang/gijiroku
        run: clojure -M:test

      - name: Lint (clj-kondo)
        working-directory: work/orgs/kotoba-lang/gijiroku
        run: clojure -M:lint
